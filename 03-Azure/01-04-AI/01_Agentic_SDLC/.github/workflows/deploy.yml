# =============================================================================
# deploy.yml — Challenge 5 starter workflow (OPTIONAL, SKELETON — not turnkey)
# -----------------------------------------------------------------------------
# The workflow uses OIDC and a user-assigned managed identity; configure the
# secrets and variables described below before enabling it in a repository.
#
# See infra/README.md for the topology and the bootstrap ordering.
#
# ----- OIDC setup (no client secret is ever stored) --------------------------
# 1. Create a user-assigned managed identity OR an app registration in Azure.
# 2. Grant it Contributor on the target resource group (or subscription scope).
# 3. Add a FEDERATED CREDENTIAL on it whose subject matches how this workflow
#    runs, e.g. for the main branch:
#        repo:<owner>/<repo>:ref:refs/heads/main
#    (or `repo:<owner>/<repo>:environment:<env>` if you gate on an environment).
# 4. Add these GitHub secrets — Settings > Secrets and variables > Actions:
#        AZURE_CLIENT_ID         (the identity/app client id)
#        AZURE_TENANT_ID
#        AZURE_SUBSCRIPTION_ID
#    and these repo/environment VARIABLES:
#        AZURE_RESOURCE_GROUP    (e.g. octocat-hack-rg)
#        AZURE_LOCATION          (e.g. eastus)
# No AZURE_CREDENTIALS / client secret is used — auth is OIDC only.
# =============================================================================

name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# OIDC: `id-token: write` lets the job request a short-lived federated token that
# azure/login exchanges for Azure creds. `contents: read` is for checkout.
permissions:
  id-token: write
  contents: read

env:
  # Pulled from the GitHub secrets/variables described in the header comment.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  # Must match namePrefix + environmentName + "acr" in infra/main.bicep.
  ACR_NAME: fmoctocatdevacr
  IDENTITY_RESOURCE_ID: ${{ vars.AZURE_IDENTITY_RESOURCE_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Provision & deploy
    runs-on: ubuntu-latest
    # TODO: Consider binding to a GitHub Environment (e.g. `environment: dev`) so
    #       you can add reviewers/approval gates and environment-scoped secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC login — note there is NO `creds:` input and no client secret.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Ensure container registry
        run: |
          az acr create --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" --sku Basic --admin-enabled false --output none

      - name: Build & push images to ACR
        run: |
          az acr build --registry "$ACR_NAME" --image "api:$IMAGE_TAG" \
            --file src/api-ts/Dockerfile src
          az acr build --registry "$ACR_NAME" --image "frontend:$IMAGE_TAG" src/frontend

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              managedIdentityResourceId="$IDENTITY_RESOURCE_ID" \
              apiImage="$ACR_NAME.azurecr.io/api:$IMAGE_TAG" \
              frontendImage="$ACR_NAME.azurecr.io/frontend:$IMAGE_TAG"

      - name: Verify deployment
        run: |
          URL=$(az deployment group show -g "$RESOURCE_GROUP" -n main \
            --query properties.outputs.frontendUrl.value -o tsv)
          echo "Application URL: $URL"
          curl --fail --retry 10 --retry-delay 5 "$URL"
